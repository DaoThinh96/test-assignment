name: Manual Test Runner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options:
          - staging
          - production
      test_type:
        description: "Select test type"
        required: true
        type: choice
        options:
          - regression
          - e2e

jobs:
  run-tests:
    name: Run ${{ inputs.test_type }} tests on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    
    # Optional: protect prod with environment rules
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create environment file
        run: |
          mkdir -p environments
          cat > "environments/.env.${{ inputs.environment }}" << EOF
          BASE_URL=${{ vars.BASE_URL }}
          BASE_API_URL=${{ vars.BASE_API_URL }}
          STORAGE_STATE=.auth/user.json
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          TEST_CREDIT_CARD=${{ secrets.TEST_CREDIT_CARD }}
          EOF
      - name: Run tests
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Test type: ${{ inputs.test_type }}"

          if [ "${{ inputs.test_type }}" = "regression" ]; then
            npx playwright test tests/spec/web/demo.spec.ts --project=chromium
          else
            npx playwright test tests/spec/web/demo.spec.ts --project=chromium
          fi
        env:
          TEST_ENV: ${{ inputs.environment }}
      - name: Install Allure
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.environment }}-${{ inputs.test_type }}
          path: allure-results
          retention-days: 7

